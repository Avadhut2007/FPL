<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}FPL Squad Lab{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">FPL <span class="accent">Squad Lab</span></a>
  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/" class="{{ 'active' if active == 'home' else '' }}" title="Home">🏠</a>
    <a href="/squad" class="{{ 'active' if active == 'squad' else '' }}" title="Squad Builder">⚽</a>
    <a href="/transfers" class="{{ 'active' if active == 'transfers' else '' }}" title="Transfers">🔁</a>
    <a href="/chart" class="{{ 'active' if active == 'chart' else '' }}" title="Charts">📊</a>
    <a href="/news" class="{{ 'active' if active == 'news' else '' }}" title="Player News">📰</a>
    <a href="/fixtures" class="{{ 'active' if active == 'fixtures' else '' }}" title="Fixtures">🗓️</a>
    <a href="/history" class="{{ 'active' if active == 'history' else '' }}" title="Past Performance">📈</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="site-footer">
  <p>Live data from the official Fantasy Premier League API.</p>
  <p class="credit">Predicted points are a transparent weighted model — not a guarantee.</p>
</footer>

{% block scripts %}{% endblock %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

{% extends "base.html" %}
{% block title %}Fixtures — FPL Squad Lab{% endblock %}
{% block content %}

<header class="page-header">
  <h1>Fixtures</h1>
  <p>Pick a gameweek to see every club's fixture and difficulty rating (green = easy, red = hard).</p>
  <div class="controls">
    <label class="budget-label">Gameweek
      <select class="select-input" id="fixtures-gw-select"></select>
    </label>
  </div>
</header>

<main class="page-main-single">
  <section class="fixtures-panel">
    <div class="panel-header">
      <h2>Fixtures</h2>
      <span class="formation-badge" id="fixtures-gw-badge">—</span>
    </div>
    <div class="fixtures-list" id="fixtures-scroll">
      <p class="table-empty">Loading fixtures…</p>
    </div>
  </section>
</main>

{% endblock %}
